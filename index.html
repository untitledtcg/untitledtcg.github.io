<style>
    @font-face {
		font-family: 'EuclidSquare';
		src: url('EuclidSquare.ttf') format('truetype');
		font-weight: 200;
		font-style: normal;
    }
    @font-face {
		font-family: 'EuclidSquare-Light';
		src: url('EuclidSquare-Light.ttf') format('truetype');
		font-weight: 200;
		font-style: normal;
    }
    @font-face {
		font-family: 'GeneralSans';
		src: url('GeneralSans-Variable.woff2') format('woff2');
		font-style: normal;
    }
    
    body {
        margin: 0;
        font-family: 'EuclidSquare';
        background-color: black;
    }
    .structure {
        display: flex;
        width: 100%;
        max-width: 1600px;
        margin-left: auto;
        margin-right: auto;
        height: 100vh;
        flex-direction: column;
    }
    .middlecontent {
        display: grid;
        grid-template-columns: 40% 60%;
        grid-template-areas: "detail selector";
        height: calc(100vh - 80px);
    }
    .selector {
        grid-area: selector;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        overflow-y: scroll;
        overflow-x: hidden;
    }
    .cardrow {
        display: flex;
        flex-direction: row;
        margin-left: 8%;
        margin-right: 8%;
        padding-top: 0.2%;
        padding-bottom: 0.2%;
        padding-left: 1%;
        padding-right: 1%;
        justify-content: center;
        flex-wrap: wrap;
    }
    .selection {
        border-radius: 3%;
        box-shadow: 0px 4px 10px #00000040;
        transition: transform .2s;
        opacity: 0.85;
        filter: brightness(80%);
        margin-left: 0.2%;
        margin-right: 0.2%;
        width: 3.5vw;
        min-width: 40px;
        max-width: 56px;
        height: auto;
        margin-bottom: 0.4%;
        cursor: pointer;
    }
    .selection:hover {
            -ms-transform: scale(1.04);
            /* IE 9 */
            -webkit-transform: scale(1.04) rotate(2deg);
            /* Safari 3-8 */
            transform: scale(1.04) rotate(2deg);
            opacity: 0.95;
            filter: brightness(90%);
    }
    .selection.active {
        opacity: 1;
        filter: brightness(95%);
        outline: 1px solid rgba(255,255,255,0.2);
        outline-offset: 2px;
    }
    .pref {
        color: gray;
        font-size: 0.5em;
    }
    a:link {
        color:lightgray;
        text-decoration: none;
        font-weight: 500;
    }
    a:visited {
        color: lightgray;
    }
    a:hover {
        color: white;
    }
    a:active {
        color: darkgray;
    }
    .contentwrapper {
        grid-area: detail;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        padding-top: 1%;
        padding-left: 3vw;
        padding-right: 3vw;
        box-sizing: border-box;
        overflow-y: auto;
    }
    .contentabout {
        display: flex;
        flex-direction: column;
        margin-top: auto;
        margin-right: 10%;
        margin-bottom: 80px;
        padding-top: 20px;
    }
    .content {
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        transition: opacity 0.15s ease;
    }
    .contenttitle {
        font-size: min(3.5em, 100%);
        text-align: left;
        margin: 0px;
        margin-left: 0px;
        font-family: 'EuclidSquare';
        color: white;
    }
    .contentdesc {
        text-align: left;
        margin: 0px;
        margin-left: 0px;
        margin-top: 1%;
        font-family: 'GeneralSans';
        font-weight: 400;
        color:white;
    }
    .cardimg {
        border-radius: 2%;
        box-shadow: 0px 4px 10px #00000020;
        margin-right: 1.5%;
        width: auto;
        max-width: 375px;
        max-height: calc(100vh - 300px);
        object-fit: contain;
        object-position: left bottom;
    }
    .cardtitles {
        color: white;
        align-self: center;
        opacity: 0.2;
        font-family: 'EuclidSquare-Light';
        padding-top: 0.5vh;
        margin-bottom: 0.3vh;
    }
    .contenttext {
        height: 95%;
        margin-top: 2.5%;
        display: flex;
        flex-direction: column;
        justify-content: start;
        color:white;
    }
    .number {
        margin-top: 0px;
        color: #FFFFFF70;
    }
    .header {
        color: white;
        font-family: 'GeneralSans';
        margin-left: 1.5%;
        margin-right: 1.5%;
        display: flex;
        font-size: 1em;
        justify-content: space-between;
        height: 80px;
    }
    .h1 >p {
        margin-right: 0.35em;
    }
    .header1 {
        color:lightgray;
    }
    .header2 {
        color:gray;
    }
    .h1 {
        display: flex;
    }
    .abouttitle {
        color: white;
        font-family: 'GeneralSans';
        font-size: 3em;
        margin-top: 0px;
        margin-bottom: -5px;
        padding-bottom: 0px;
        font-weight: 500;
    }
    .abouttext {
        color: white;
        font-family: 'GeneralSans';
        font-size: 1em;
        font-weight: 500;
        margin-top: 5px;
    }
    .titlearea {
        display: flex;
        flex-direction: column;
    }

    @media (max-width: 768px) {
        .structure {
            height: 100vh;
            height: 100dvh;
        }
        .header {
            height: auto;
            flex-shrink: 0;
            flex-wrap: wrap;
            padding: 12px 16px;
            gap: 2px;
            box-sizing: border-box;
        }
        .h1 {
            flex-wrap: wrap;
            gap: 0px;
        }
        .h1 > p {
            margin: 2px 4px 2px 0;
            font-size: 0.85em;
        }
        .header > p {
            margin: 2px 0;
            font-size: 0.85em;
        }
        .middlecontent {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            overflow: hidden;
            height: auto;
        }
        .contentwrapper {
            flex-shrink: 0;
            height: 38vh;
            padding: 16px 16px 12px;
            justify-content: flex-start;
            overflow: hidden;
            box-sizing: border-box;
        }
        .selector {
            flex: 1;
            min-height: 0;
            width: 100%;
            overflow-y: scroll;
        }
        .contentabout {
            margin-right: 0;
            padding: 12px 16px;
            margin-bottom: 32px;
        }
        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto 1fr;
            grid-template-areas:
                "img info"
                "img desc";
            gap: 8px;
            height: 100%;
        }
        .cardimg {
            grid-area: img;
            order: 0;
            width: 100%;
            max-width: none;
            height: auto;
            object-fit: unset;
            align-self: start;
            margin-right: 0;
        }
        .titlearea {
            grid-area: info;
            margin-bottom: 0;
        }
        .contenttext {
            display: none;
        }
        .abouttitle {
            font-size: 1.4em;
        }
        .contentdesc {
            font-size: 0.9em;
        }
        .cardrow {
            margin-left: 2%;
            margin-right: 2%;
        }
        .selection {
            width: 15vw;
            min-width: 0;
            max-width: none;
            height: auto;
        }
    }
</style>

<script>

    const donecards = ["9", "11", "14", "15", "16", "17", "18", "19", "20", "21", "23", "24", "27", "40", "43", "47", "48", "49"];
    const hashCard = window.location.hash.replace(/^#/, '').trim();
    const tab = hashCard ? hashCard : donecards[Math.floor(Math.random() * donecards.length)];

    async function stringFromFile(f) {
      try {
        const response = await fetch(f);
        if (!response.ok) {
          throw new Error(`HTTP error! Status: ${response.status}`);
        }
        return await response.text();
      } catch (err) {
        console.error("Failed to load file:", err);
        return "";
      }
    }

    function refresh(src, el) {
        history.pushState(null, '', '#' + src);
        const content = document.querySelector('.content');
        content.style.opacity = '0';

        document.querySelectorAll('.selection').forEach(s => s.classList.remove('active'));
        if (el) el.classList.add('active');

        Promise.all([
            stringFromFile(`stuff/${src}/title.txt`),
            stringFromFile(`stuff/${src}/desc.txt`),
            stringFromFile(`stuff/${src}/cred.txt`)
        ]).then(([title, desc, cred]) => {
            document.getElementById('contenttitle').innerHTML = title;
            document.getElementById('contentdesc').innerHTML = desc;
            document.getElementById('number').innerHTML = `${src}/120&nbsp;&nbsp;&nbsp;${cred}`;
            document.getElementById('img').src = `stuff/${src}/img.png`;
            content.style.opacity = '1';
        });
    }

    refresh(tab);

    window.addEventListener('popstate', () => {
        const src = window.location.hash.replace(/^#/, '').trim();
        if (src) refresh(src);
    });

</script>
